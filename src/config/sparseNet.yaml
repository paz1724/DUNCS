system_model:
  N: 5                                    # Number of antennas/sensors in the array
  M: 1                                   # Number of sources/targets (can be a range like [5, 10])
  T: 8                                  # Number of snapshots/time samples
  snr: 30                                 # Signal-to-noise ratio in dB (can be a range like [5, 15])
  eta: 0.0                                # Array geometry uncertainty parameter (normalized misalignment)
  bias: 0.0                               # Uniform bias in array element positions
  sv_noise_var: 0.0                       # Steering vector noise variance
  field_type: "Far"                       # Field type: "Far" or "Near" field
  signal_nature: "non-coherent"           # Signal coherence: "coherent" or "non-coherent"
  array_form: "ula"                       # Array geometry: "ula" or "mra-N" (minimum redundancy array with N elements)
  doa_range: [-70, 70]                    # Direction of arrival (DOA) range in degrees [min, max]
  min_gap: 5                              # Minimum gap between DOAs in degrees (for training data generation)


admm_params:
  mu: 2.5e-3                              # ADMM penalty parameter (proximal term weight)
  rho:  2                                 # ADMM step size/penalty parameter


model:
  model_type: "SparseNet"                 # Model type to use: "DUNCS", "SparseNet", "SubspaceNet", etc.
  model_params:
    tau: 8                                # Maximum lag/autocorrelation delay for sparse covariance matrix
    diff_method: "esprit"                 # Difference method for sparse array processing: "esprit", "music", etc.


training:
  samples_size: 20480                     # Total number of training samples to generate
  train_test_ratio: 0.1                   # Ratio of test to training samples (0.1 = 10% test, 90% train)
  epochs: 160                             # Number of training epochs
  batch_size: 256                         # Batch size for training
  optimizer: "AdamW"                      # Optimizer: "Adam", "AdamW", "SGD", etc.
  learning_rate: 5e-4                     # Learning rate for optimizer
  weight_decay: 2e-5                      # L2 regularization/weight decay coefficient
  step_size: 50                           # Step size for learning rate scheduler (epochs between steps)
  gamma: 0.5                              # Multiplicative factor for learning rate scheduler
  scheduler: "CustomLR"                   # Learning rate scheduler: "ReduceLROnPlateau", "StepLR", "CustomLR"
  training_objective: "angle"             # Training objective: "angle" (DOA only) or "angle, range" (DOA + range)
  balance_factor: 1.0                     # Balance factor for multi-objective losses
  true_doa_train: null                    # Predefined DOA values for training (null = random generation)
  true_range_train: null                  # Predefined range values for training (null = random generation)
  true_doa_test: null                     # Predefined DOA values for testing (null = random generation)
  true_range_test: null                   # Predefined range values for testing (null = random generation)


evaluation:
  criterion: [rmspe]                      # Evaluation metrics: ["rmspe"], ["admm_objective"], or both
  balance_factor: 1.0                     # Balance factor for evaluation metrics
  covariance_reconstruction: "averaging"  # Covariance reconstruction method: "averaging", "admm", "admm_cvxpy", "sample"
  admm_iterations: [20, 500]              # ADMM iteration counts to evaluate (list of iteration numbers)
  models:
#    SparseNet:                           # Model-specific evaluation parameters (optional, commented out)
#      tau: 8
#      diff_method: "esprit"
  augmented_methods: []                   # List of augmented/deep learning methods to evaluate
  subspace_methods: ["esprit"]            # List of subspace methods to evaluate: ["esprit"], ["music"], etc.

commands:
  create_data: true                       # Whether to create new dataset (true) or load existing (false)
  save_dataset: false                     # Whether to save the generated dataset to disk
  train_model: true                      # Whether to train the model
  save_model: false                       # Whether to save the trained model weights
  evaluate_mode: true                     # Whether to run evaluation after training
  plot_results: true                      # Whether to display plots during training/evaluation
  save_plots: true                        # Whether to save plots to files

# Optional scenario sweep:                # Uncomment to run multiple simulations with different parameter values
scenario:                                  # Parameters to sweep over (each list item becomes a separate simulation)
#  snr: [15, 20]                          # Example: run simulations with SNR = 15 dB and SNR = 20 dB
#  T: [500, 400, 300, 250, 200, 150, 100, 50, 30]  # Example: run simulations with different snapshot counts