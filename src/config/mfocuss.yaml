system_model:
  N: 5                                    # Number of antennas/sensors in the array
  M: 1                                    # Number of sources/targets (can be a range like [1, 2])
  T: 8                                    # Number of snapshots/time samples
  snr: 30                                 # Signal-to-noise ratio in dB (can be a range like [5, 15])
  eta: 0.0                                # Array geometry uncertainty parameter (normalized misalignment)
  bias: 0.0                               # Uniform bias in array element positions
  sv_noise_var: 0.0                       # Steering vector noise variance
  field_type: "Far"                       # Field type: "Far" or "Near" field
  signal_nature: "non-coherent"           # Signal coherence: "coherent" or "non-coherent"
  array_form: "ula"                       # Array geometry: "ula" or "mra-N"
  antenna_pattern: true                   # Draw all samples from the RECORDED ULA3 steering manifold (Mid band)
  doa_range: [-70, 70]                    # Direction of arrival (DOA) range in degrees [min, max]
  min_gap: 5                              # Minimum gap between DOAs in degrees (for data generation)


admm_params:
  mu: 2.5e-3
  rho:  2


model:
  model_type: "MFOCUSS"                   # Classical M-FOCUSS (no training) — the study's baseline
  model_params:                           # EXACT parameters of the comparison-table baseline row
    num_iterations: 100                   # FOCUSS iterations (Hof schedule anneals p over these)
    grid_size: 901                        # Fine grid columns; coarse pair grid capped by coarse_cols_per_180deg
    p: 0.8                                # lp diversity exponent (legacy arg; the Hof schedule governs)
    lam: 0.05                             # Regularization (legacy arg; lam_multi=0.02 governs multi-source)
    grid_range_deg: [-180, 180]           # Full-azimuth dictionary (front/back resolved by the recorded manifold)
    # All other knobs (p_decay, lam_multi, coarse_cols_per_180deg, pick_temp, ...) are named
    # constructor defaults in src/models_pack/mfocuss.py — override any of them here if needed.


training:                                 # Unused (classical, no training) — kept for schema compatibility
  samples_size: 4096                      # Total number of evaluation samples to generate
  train_test_ratio: 0.5                   # Ratio of test to training samples
  epochs: 1
  batch_size: 256
  optimizer: "AdamW"
  learning_rate: 5e-4
  weight_decay: 2e-5
  step_size: 50
  gamma: 0.5
  scheduler: "CustomLR"
  training_objective: "angle"
  balance_factor: 1.0
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null


evaluation:
  criterion: [rmspe]
  balance_factor: 1.0
  covariance_reconstruction: "averaging"  # Covariance reconstruction method for classical baselines
  admm_iterations: [20, 500]
  models:
  augmented_methods: []
  subspace_methods: ["music"]             # classical subspace baseline evaluated alongside MFOCUSS


commands:
  create_data: true
  save_dataset: false
  train_model: false                      # classical — nothing to train (weights-free eval path)
  save_model: false
  evaluate_mode: true
  plot_results: true
  save_plots: true

scenario:
